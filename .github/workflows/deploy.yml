# =============================================================================
# Deploy loginrek-dashboard ke VPS
#
#   check   : lint + typecheck + build AdonisJS
#   build   : build image Docker -> push ke GHCR (tag sha-xxxxxxx + latest)
#   package : bungkus docker-compose.yml + .env.example sebagai artifact
#   deploy  : kirim artifact ke VPS (SCP) -> pull image -> migrate -> up
#
# Secrets yang dibutuhkan: lihat README.md bagian "GitHub Secrets".
# Aplikasi mobile (loginrek-mobile) tidak dideploy dari workflow ini.
# =============================================================================

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "loginrek-dashboard/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASENAME: loginrek-dashboard
  DASHBOARD_DIR: loginrek-dashboard

jobs:
  check:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.DASHBOARD_DIR }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.DASHBOARD_DIR }}/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck

  build:
    name: Build & push image (GHCR)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.vars.outputs.owner }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Siapkan nama image
        id: vars
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/${{ env.IMAGE_BASENAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ env.DASHBOARD_DIR }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package:
    name: Artifact compose + env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/upload-artifact@v7
        with:
          name: deploy-bundle
          path: |
            docker-compose.yml
            .env.example
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy ke VPS
    needs: [build, package]
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/loginrek' }}
      IMAGE_TAG: ${{ needs.build.outputs.tag }}
      GHCR_OWNER: ${{ needs.build.outputs.owner }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: deploy-bundle
          path: bundle

      - name: Siapkan folder di VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || '22' }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_PATH
          script: mkdir -p "$DEPLOY_PATH"

      - name: Kirim docker-compose.yml & .env.example
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || '22' }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "bundle/docker-compose.yml,bundle/.env.example"
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Pull image, migrate, restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || '22' }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_PATH,IMAGE_TAG,GHCR_OWNER,GHCR_USERNAME,GHCR_TOKEN
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            # Deploy pertama: .env belum ada -> buat dari contoh lalu berhenti.
            if [ ! -f .env ]; then
              cp .env.example .env
              echo "::error::.env belum ada di $DEPLOY_PATH. Sudah dibuat dari .env.example — isi nilai CHANGE_ME lalu jalankan ulang workflow."
              exit 1
            fi
            if grep -qE '^[A-Z0-9_]+=CHANGE_ME' .env; then
              echo "::error::.env masih berisi CHANGE_ME. Lengkapi dulu di $DEPLOY_PATH/.env"
              exit 1
            fi

            # Simpan tag image yang dideploy ke .env (memudahkan rollback manual)
            set_env() {
              if grep -q "^$1=" .env; then sed -i "s|^$1=.*|$1=$2|" .env; else echo "$1=$2" >> .env; fi
            }
            set_env IMAGE_TAG "$IMAGE_TAG"
            set_env GHCR_OWNER "$GHCR_OWNER"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            docker compose pull
            docker compose up -d --wait postgres rustfs
            docker compose run --rm --no-deps dashboard node ace migration:run --force
            docker compose run --rm --no-deps dashboard node ace storage:init
            docker compose up -d --wait --remove-orphans dashboard

            docker compose ps
            docker image prune -f || true
            echo "Deployed ghcr.io/$GHCR_OWNER/${{ env.IMAGE_BASENAME }}:$IMAGE_TAG"
